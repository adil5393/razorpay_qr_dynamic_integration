name: razorpay-qr

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.local

    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:?Set LOCAL_DATABASE_URL}
      RUN_MIGRATIONS_ON_STARTUP: "false"

    expose:
      - "8000"

    networks:
    - app
    - database

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "127.0.0.1:8090:80"

    depends_on:
      - backend

    networks:
      - app

networks:
  app:
    driver: bridge

  database:
    external: true
    name: razorpay-db-network

volumes:
  postgres_data:
